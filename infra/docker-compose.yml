services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: aidc-carbon-postgres
    environment:
      POSTGRES_USER: aidc
      POSTGRES_PASSWORD: aidc
      POSTGRES_DB: aidc_carbon
    ports:
      - "5432:5432"
    volumes:
      - aidc-postgres:/home/postgres/pgdata/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidc -d aidc_carbon"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: aidc-carbon-redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - aidc-redpanda:/var/lib/redpanda/data

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: aidc-carbon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aidcminio
      MINIO_ROOT_PASSWORD: aidcminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aidc-minio:/data

volumes:
  aidc-postgres:
  aidc-redpanda:
  aidc-minio:
